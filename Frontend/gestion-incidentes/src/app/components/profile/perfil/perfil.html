<div class="container mt-4 profile-page">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb breadcrumb-civix">
      <li class="breadcrumb-item">
        <a routerLink="/">Inicio</a>
      </li>
      <li class="breadcrumb-item active" aria-current="page">Mi Perfil</li>
    </ol>
  </nav>

  <div class="row g-4">

    <!-- Columna lateral -->
    <div class="col-md-3">
      <aside class="profile-side">
        <div class="profile-avatar">
          <i class="bi bi-person" aria-hidden="true"></i>
        </div>
        <h5 class="profile-name">{{ user.name }} {{ user.lastName }}</h5>
        <span class="role-badge">{{ user.role }}</span>
      </aside>
    </div>

    <!-- Formulario principal -->
    <div class="col-md-9">
      <div class="profile-main">
        <h3 class="profile-title">Mi Perfil</h3>

        <form (ngSubmit)="saveChanges()">
          <div class="row g-3">

            <div class="col-md-6">
              <label class="form-label-civix">Nombre</label>
              <input
                type="text"
                class="form-control profile-input"
                [(ngModel)]="editedValues.name"
                name="name"
                [disabled]="!isEditing"
                (ngModelChange)="detectChanges()"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label-civix">Apellido</label>
              <input
                type="text"
                class="form-control profile-input"
                [(ngModel)]="editedValues.lastName"
                name="lastName"
                [disabled]="!isEditing"
                (ngModelChange)="detectChanges()"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label-civix">Correo electronico</label>
              <input
                class="form-control profile-input profile-input--readonly"
                [value]="user.email"
                disabled
              />
              <!-- Justificación del campo bloqueado -->
              <span class="field-readonly-note">No se puede modificar</span>
            </div>

            <div class="col-md-6">
              <label class="form-label-civix">Telefono</label>
              <input
                type="text"
                class="form-control profile-input"
                [(ngModel)]="editedValues.phone"
                name="phone"
                [disabled]="!isEditing"
                (ngModelChange)="detectChanges()"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label-civix">Direccion</label>
              <input
                type="text"
                class="form-control profile-input"
                [(ngModel)]="editedValues.address"
                name="address"
                [disabled]="!isEditing"
                (ngModelChange)="detectChanges()"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label-civix">Rol</label>
              <input
                class="form-control profile-input profile-input--readonly"
                [value]="user.role"
                disabled
              />
              <span class="field-readonly-note">Asignado por la municipalidad</span>
            </div>

          </div>

          <div class="profile-actions">
            <button
              type="submit"
              class="btn-guardar"
              [disabled]="!hasChanges || !isEditing"
            >
              <i class="bi bi-check2"></i>
              Guardar cambios
            </button>
            <button
              type="button"
              class="btn-editar"
              (click)="toggleEdit()"
            >
              <i class="bi bi-pencil"></i>
              {{ isEditing ? 'Cancelar edicion' : 'Editar perfil' }}
            </button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
