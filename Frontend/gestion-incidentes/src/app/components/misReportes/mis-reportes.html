<div>
  <main class="page-main">

    <nav aria-label="breadcrumb" class="breadcrumb-nav">
      <ol class="breadcrumb breadcrumb-civix">
        <li class="breadcrumb-item">
          <a routerLink="/">Inicio</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">Mis Reportes</li>
      </ol>
    </nav>

    <h3 class="page-title">Mis Reportes</h3>

    <div class="report-list">
      <article
        class="report-item"
        [ngClass]="'status-' + reporte.status"
        *ngFor="let reporte of reports"
      >
        <div class="report-main">
          <span class="report-title">{{ reporte.title }}</span>
          <span class="report-address">
            <i class="bi bi-geo-alt" aria-hidden="true"></i>
            {{ reporte.address }}
          </span>
          <p class="report-description">{{ reporte.description }}</p>
        </div>

        <div class="report-side">
          <span
            class="status-badge"
            [ngClass]="statusLabels[reporte.status].class"
          >
            {{ statusLabels[reporte.status].text }}
          </span>
          <span class="report-date">
            <i class="bi bi-clock" aria-hidden="true"></i>
            {{ reporte.createdAt | date:'dd/MM/yyyy' }}
          </span>
        </div>
      </article>
    </div>

    <div *ngIf="reports.length === 0" class="empty-state">
      No ha realizado ningun reporte todavia.
    </div>

  </main>
</div>
