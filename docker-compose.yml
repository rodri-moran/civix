version: "3.8"

services:
  # GATEWAY
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    networks:
      - comuna-network

  # AUTH SERVICE
  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    depends_on:
      - auth-db
      - user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}

    networks:
      - comuna-network


  auth-db:
    image: postgres:16
    ##volumes:
      ##- ./auth-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    container_name: auth-db
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - comuna-network

  # USER SERVICE
  user-service:
    container_name: user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile
    depends_on:
      - user-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - comuna-network

  user-db:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - comuna-network

  # REPORT SERVICE
  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: report-service
    depends_on:
      - report-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://report-db:5432/${REPORT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${REPORT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${REPORT_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      SECURITY_LOG_LEVEL: INFO
    networks:
      - comuna-network

  report-db:
    image: postgres:16
    container_name: report-db
    environment:
      POSTGRES_DB: ${REPORT_DB_NAME}
      POSTGRES_USER: ${REPORT_DB_USER}
      POSTGRES_PASSWORD: ${REPORT_DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - report-db-data:/var/lib/postgresql/data
    networks:
      - comuna-network

  #INVENTORY SERVICE
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    depends_on:
      - inventory-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/${INVENTORY_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${INVENTORY_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - comuna-network

  inventory-db:
    image: postgres:16
    container_name: inventory-db
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - comuna-network

networks:
  comuna-network:
    driver: bridge

volumes:
  auth-db-data:
  user-db-data:
  report-db-data:
  inventory-db-data: